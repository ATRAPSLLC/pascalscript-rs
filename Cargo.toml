[package]
name = "pascalscript"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Read-only parser + disassembler for the RemObjects PascalScript III binary container format (IFPS)"
license = "Apache-2.0"
repository = "https://github.com/ATRAPSLLC/pascalscript-rs"
readme = "README.md"
keywords = ["pascalscript", "ifps", "remobjects", "delphi", "parser"]
categories = ["parser-implementations"]

# pascalscript parses adversarial IFPS bytecode blobs. These lints
# prevent the parser from panicking on malformed input. The
# `cfg_attr(test, allow(...))` escape hatch in `src/lib.rs` lets tests
# still use `unwrap`/`expect`/`panic` for terseness. This crate also
# denies `unsafe_code`.
[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"

[dependencies]
